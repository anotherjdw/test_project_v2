# payroll_register_data_contract.yaml -- generated by pipeline-automator generate (create-job)
contract:
  name: payroll_register
  contact: example_team@example.com
  description: <what this dataset is>
  classification:
    contains_pii: false
  external: false
  owner: example_team
  version: 1.0.0
  layer: preprocessed
  dataset: payroll_register
  grain:
    unique_key:
    - payroll_register_key
  freshness:
    cadence: daily
    max_lateness: 24h
  schema:
  - name: employee_id
    type: string
    nullable: false
    description: FK to employee_master.employee_id.
    classification: pii
  - name: pay_run_id
    type: string
    nullable: false
    description: Identifier for the payroll run that produced this line.
  - name: pay_period
    type: string
    nullable: false
    description: Pay period this line applies to, expressed as year-month; on a retro
      line this is the original period, not the period of payment.
  - name: pay_date
    type: string
    nullable: false
    description: Date payment was issued, as an ISO-8601 string.
  - name: run_type
    type: string
    nullable: false
    description: Type of payroll run, such as regular, off-cycle or correction.
    constraints:
      enum_ref: payroll_run_type
  - name: lohnart_code
    type: string
    nullable: false
    description: FK to pay_component_reference.lohnart_code; wage type code.
    constraints:
      enum_ref: pay_component_reference.lohnart_code
  - name: component_name
    type: string
    nullable: false
    description: Human-readable pay component name.
  - name: gl_account
    type: string
    nullable: false
    description: GL account this line posts to.
  - name: cost_center_code
    type: string
    nullable: false
    description: Cost center as booked for this pay period, not the employee's current
      cost center; required for correct mid-period transfer attribution.
  - name: location_code
    type: string
    nullable: false
    description: FK to location_reference.location_code; location as of this pay period.
    constraints:
      enum_ref: location_reference.location_code
  - name: bearer
    type: string
    nullable: false
    description: Whether this component is borne by the employer or the employee.
    constraints:
      enum_ref: pay_component_bearer
  - name: amount_eur
    type: decimal(14,2)
    unit: EUR
    nullable: false
    description: Monetary amount for this pay component line.
    classification: sensitive
  - name: assessment_base_eur
    type: decimal(14,2)
    unit: EUR
    nullable: true
    description: Base amount this component's contribution or tax was calculated against;
      null where not applicable to the component type.
    classification: sensitive
  - name: quantity
    type: decimal(12,4)
    nullable: true
    description: Quantity basis for the component, such as hours; null for flat-amount
      components.
  - name: rate
    type: decimal(12,6)
    nullable: true
    description: Rate applied to quantity to derive amount_eur; null for flat-amount
      components.
