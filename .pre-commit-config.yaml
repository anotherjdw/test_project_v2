repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies: []
        args: [--ignore-missing-imports]

  # NOTE: no terraform_fmt / terraform_validate hooks. CI runs `pre-commit run
  # --all-files` in the `quality` job, which sets up Python only - these hooks
  # shell out to the `terraform` binary and would fail there unconditionally.
  # `terraform_validate` could not have worked there even with the binary, as
  # it needs an initialised directory and nothing runs `init` in that job.
  # Terraform is covered by the dedicated `terraform` CI job (fmt -check, init,
  # validate) and locally by `make fmt`. Do not re-add them without also moving
  # the pre-commit step out of the Python-only job.
