# deploy-dev.yml -- generated by pipeline-automator scaffold (project init)
# Deploys the dev environment of payroll_pipeline: terraform apply, then
# Iceberg catalog DDL, then wheel/script upload -- all behind the dev GitHub
# Environment's approval gate. This is one of two renders of the same
# deploy-env.yml.j2 template; edit the template, not this file, if both
# environments need the same fix.
#
# Every credentialed AWS call in this repository lives in deploy-dev.yml or
# deploy-prod.yml. ci.yml never assumes an AWS role.
name: Deploy dev

on:
  pull_request:
    branches: ["develop"]
  push:
    branches: ["develop"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  plan:
    name: Terraform plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Configure AWS credentials (read-only plan role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform init
        run: terraform -chdir=infra/terraform init -backend-config=backend/dev.hcl

      - name: Terraform plan
        run: |
          terraform -chdir=infra/terraform plan -var-file=dev.tfvars -no-color \
            -out=tfplan | tee plan_output.txt

      - name: Post plan as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan_output.txt', 'utf8').slice(0, 60000);
            const body = `### Terraform plan -- dev\n\`\`\`\n${plan}\n\`\`\``;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  apply:
    name: Terraform apply
    if: github.event_name != 'pull_request'
    environment: dev
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-payroll_pipeline-dev
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    outputs:
      scripts_bucket: ${{ steps.bucket.outputs.scripts_bucket }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Configure AWS credentials (deploy role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform init
        run: terraform -chdir=infra/terraform init -backend-config=backend/dev.hcl

      - name: Terraform apply
        run: terraform -chdir=infra/terraform apply -auto-approve -var-file=dev.tfvars

      - name: Read scripts bucket name
        id: bucket
        run: |
          bucket=$(terraform -chdir=infra/terraform output -json bucket_names | jq -r '.scripts')
          echo "scripts_bucket=$bucket" >> "$GITHUB_OUTPUT"

  catalog-apply:
    name: Apply Iceberg catalog DDL
    needs: [apply]
    environment: dev
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      DATA_PRODUCT: payroll_pipeline
      ENVIRONMENT: dev
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (deploy role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Apply catalog DDL
        run: ./scripts/apply_catalog.sh

  package:
    name: Build wheel and upload job scripts
    needs: [apply]
    environment: dev
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build wheel
        run: python -m build --wheel

      - name: Configure AWS credentials (deploy role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload library wheel
        run: |
          wheel=$(ls dist/*.whl)
          aws s3 cp "$wheel" "s3://${{ needs.apply.outputs.scripts_bucket }}/lib/payroll_pipeline.whl"

      - name: Upload job scripts
        run: |
          for job_dir in src/payroll_pipeline/jobs/*/; do
            job_name=$(basename "$job_dir")
            aws s3 cp "${job_dir}${job_name}.py" \
              "s3://${{ needs.apply.outputs.scripts_bucket }}/scripts/${job_name}/${job_name}.py"
          done
