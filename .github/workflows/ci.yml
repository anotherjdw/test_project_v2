# ci.yml -- generated by pipeline-automator scaffold (project init)
# CI for the payroll_pipeline data pipeline: pre-commit, lint, type-check,
# the full test suite (unit, integration, end_to_end, in one pytest invocation so the
# session-scoped Spark fixture is shared), a Terraform format/validate gate, and a
# credential-free wheel build check.
#
# THIS WORKFLOW MUST NEVER ASSUME AN AWS ROLE. It has no `id-token` permission
# and no configure-aws-credentials call, and must keep none: every credentialed
# step lives in deploy-*.yml, behind a GitHub Environment. `terraform validate`
# runs with -backend=false and so needs no state access -- that is why it can
# live in an uncredentialed workflow at all.
name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check & tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Java (required by PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

      - name: Lint (ruff)
        run: ruff check src/

      - name: Type-check (mypy)
        run: mypy src/

      - name: Tests (pytest -- unit, integration, end_to_end)
        run: pytest --cov=src --cov-report=term-missing

  terraform:
    name: Terraform format & validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform format check
        run: terraform fmt -check -recursive infra/terraform/

      - name: Terraform init (no backend)
        run: terraform -chdir=infra/terraform init -backend=false

      - name: Terraform validate
        run: terraform -chdir=infra/terraform validate

  build:
    name: Build wheel (no upload)
    needs: [quality, terraform]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build wheel
        run: python -m build --wheel
